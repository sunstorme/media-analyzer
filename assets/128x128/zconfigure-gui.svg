<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gearGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Gear/cog background -->
  <circle cx="64" cy="64" r="55" fill="url(#gearGradient)" opacity="0.9"/>

  <!-- Gear teeth -->
  <g fill="#2E7D32">
    <rect x="58" y="4" width="12" height="16" rx="2"/>
    <rect x="58" y="108" width="12" height="16" rx="2"/>
    <rect x="4" y="58" width="16" height="12" rx="2"/>
    <rect x="108" y="58" width="16" height="12" rx="2"/>
    <rect x="20" y="20" width="14" height="12" rx="2" transform="rotate(45 27 26)"/>
    <rect x="94" y="20" width="14" height="12" rx="2" transform="rotate(-45 101 26)"/>
    <rect x="20" y="94" width="14" height="12" rx="2" transform="rotate(-45 27 102)"/>
    <rect x="94" y="94" width="14" height="12" rx="2" transform="rotate(45 101 102)"/>
  </g>

  <!-- Inner circle (light) -->
  <circle cx="64" cy="64" r="35" fill="#81C784" opacity="0.3"/>

  <!-- Center hole -->
  <circle cx="64" cy="64" r="12" fill="#1B5E20"/>

  <!-- Terminal prompt symbol -->
  <g fill="white">
    <path d="M 42 58 L 54 64 L 42 70 Z"/>
    <rect x="58" y="68" width="20" height="4" rx="1"/>
  </g>
</svg>
